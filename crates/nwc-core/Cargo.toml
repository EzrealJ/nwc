[package]
name = "nwc-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
# DIB↔PNG 转码（剪贴板图片；原在 nwc-win，挪入 core 以便在任意平台跑解码单测）
png = "0.17"
# 0.3 在 windows-gnu 上用 raw-dylib 引 bcryptprimitives，需要自备 as.exe 的 dlltool；
# 0.2 走普通导入库，兼容 rustup 的 self-contained GNU 工具链
getrandom = "0.2"

# timestamp 本地时间（仅 GetLocalTime；版本锁 0.57 与 nwc-win 一致，见根 Cargo.toml 说明）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
