[workspace]
resolver = "2"
members = ["crates/nwc-core", "crates/nwc-win", "crates/nwc-mac"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 2

[profile.release.package."*"]
opt-level = 2
