# 发布工作流：推 v* 标签自动构建并发 Release；也可在 Actions 页手动触发
# 产物：win-x64 / macos-arm64 / macos-x64（Linux 暂无壳，见 README）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v0.1.1；不存在时在 main HEAD 上创建）'
        required: true

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nwc-core
      - run: cargo test -p nwc-win -- --test-threads=1
      - run: cargo build --release -p nwc-win
      - name: 打包
        shell: pwsh
        run: |
          $TAG = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/nwc.exe -DestinationPath "dist/NetWorkClipboard-$TAG-win-x64.zip"
      # Windows runner 的 Git Bash 里 tar 是 GNU tar，-a 对 .zip 后缀会产出改名的
      # 未压缩 tar（假 zip）；所有产物上传前用 zipfile 实测，坏格式直接失败
      - name: 校验 zip 格式
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'EOF'
          import glob, zipfile
          files = glob.glob('dist/*.zip')
          assert files, 'no zip found in dist/'
          for f in files:
              z = zipfile.ZipFile(f)
              bad = z.testzip()
              assert bad is None, f'{f}: corrupt entry {bad}'
              assert z.namelist(), f'{f}: empty archive'
              print('OK', f, z.namelist())
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/*.zip
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test -p nwc-core
        if: matrix.arch == 'arm64' # runner 原生跑一遍即可，两个交叉 target 无需重复
      - run: cargo test -p nwc-mac -- --test-threads=1
        if: matrix.arch == 'arm64'
      - run: cargo build --release -p nwc-mac --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="${INPUT_TAG:?}"; else TAG="$GITHUB_REF_NAME"; fi
          mkdir -p dist
          tar -a -cf "dist/NetWorkClipboard-$TAG-macos-${{ matrix.arch }}.zip" -C "target/${{ matrix.target }}/release" nwc-mac
          # .app bundle（Finder 双击即用；裸二进制仅适合终端调试）
          VER="${TAG#v}"
          APP="NetWorkClipboard.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/nwc-mac" "$APP/Contents/MacOS/nwc-mac"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleName</key><string>NetWorkClipboard</string>
            <key>CFBundleDisplayName</key><string>NetWorkClipboard</string>
            <key>CFBundleIdentifier</key><string>com.ezrealj.nwc</string>
            <key>CFBundleExecutable</key><string>nwc-mac</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>NetWorkClipboard 需要访问本地网络来发现并连接你的另一台电脑，同步剪贴板。</string>
          </dict>
          </plist>
          PLIST
          codesign -s - --force "$APP" || true
          tar -a -cf "dist/NetWorkClipboard-$TAG-macos-${{ matrix.arch }}-app.zip" "$APP"
      - name: 校验 zip 格式
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          files = glob.glob('dist/*.zip')
          assert files, 'no zip found in dist/'
          for f in files:
              z = zipfile.ZipFile(f)
              bad = z.testzip()
              assert bad is None, f'{f}: corrupt entry {bad}'
              assert z.namelist(), f'{f}: empty archive'
              print('OK', f, z.namelist())
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 查看产物
        run: ls -l dist
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: NetWorkClipboard ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
          fail_on_unmatched_files: true
