# 日常 CI：PR 全矩阵把关，main 只在代码变更时跑（省公共资源）。
# 分层策略（保障组合可用性）：
# - core（平台无关逻辑）→ Linux 主阵地，win/mac 顺带复跑（core 内有 cfg 分支测试：
#   Windows 保留文件名 / unix 本地时间戳，各平台行为各自锁定）
# - 壳层平台 API 真机测试（剪贴板读写往返）→ 只能在对应系统的 runner 上跑
# - 端到端（engine_roundtrip / loopback：双引擎真实 TCP 互发）→ core 包，Linux 跑
name: ci

on:
  push:
    branches: [main]
    paths: # 纯文档/示例变更不消耗 runner
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch: # 手动兜底入口

# 同一 PR/分支连续推送时取消旧的在跑任务
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nwc-core

  mac:
    name: mac platform tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nwc-core
      # 剪贴板是全局状态：测试内静态锁 + 单线程双保险
      - run: cargo test -p nwc-mac -- --test-threads=1

  win:
    name: win platform tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nwc-core
      - run: cargo test -p nwc-win -- --test-threads=1
